[workspace]
members = ["twinex-cli"]
resolver = "2"

[workspace.package]
description = "A localization code generator compatible with the Twine file format"
version = "0.2.0"
edition = "2021"
rust-version = "1.96.0"
authors = ["shenghaiyang"]
license = "Apache-2.0"
repository = "https://github.com/shenghaiyang/twinex"
homepage = "https://github.com/shenghaiyang/twinex"
readme = "README.md"

[workspace.dependencies]
anyhow = "=1.0.102"
clap = "=4.6.1"
regex = "=1.12.4"
serde = "=1.0.228"
serde_json = "=1.0.150"
thiserror = "=2.0.18"
zip = "=8.6.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

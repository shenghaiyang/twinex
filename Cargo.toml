[workspace]
members = ["twinex-cli"]
resolver = "2"

[workspace.package]
description = "A localization code generator compatible with the Twine file format"
version = "0.3.0"
edition = "2021"
rust-version = "1.96.0"
authors = ["shenghaiyang"]
license = "Apache-2.0"
repository = "https://github.com/shenghaiyang/twinex"
homepage = "https://github.com/shenghaiyang/twinex"
readme = "README.md"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = "=4.6.6"
regex = "=1.13.1"
serde = "=1.0.229"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
zip = "=8.6.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

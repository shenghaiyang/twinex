name: Docs
on:
  push:
    branches:
      - trunk
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 0.1.1, 0.1.1-beta01)"
        required: true
        default: ""
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: pip install git+https://github.com/squidfunk/mike.git
      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            echo "Error: no version found (use manual dispatch or push a v* tag)" >&2
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
      - name: Deploy docs
        run: |
          mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest
          mike set-default --push latest
